<script>
// ── Konverter .docx → soal, jalan 100% di browser (tanpa library) ───────────
// Alur: zip (DecompressionStream bawaan browser) → word/document.xml (DOMParser
// bawaan) → baris teks/gambar → parser soal yang sama.
// Gambar dipakai apa adanya (Blob langsung dari zip, tanpa re-encode); hanya
// gambar yang di-crop/rotasi/flip di Word yang digambar ulang lewat canvas.
const DOCX_NS = {
  w: "http://schemas.openxmlformats.org/wordprocessingml/2006/main",
  a: "http://schemas.openxmlformats.org/drawingml/2006/main",
  r: "http://schemas.openxmlformats.org/officeDocument/2006/relationships",
  mc: "http://schemas.openxmlformats.org/markup-compatibility/2006",
  v: "urn:schemas-microsoft-com:vml",
};
// EMF/WMF sengaja tidak ada: browser tidak bisa menampilkannya.
const IMG_MIME = { png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", bmp: "image/bmp", webp: "image/webp", svg: "image/svg+xml" };

// Pembaca zip minimal: baca central directory, inflate hanya file yang diminta.
async function openZip(buf) {
  const u8 = new Uint8Array(buf), dv = new DataView(buf), td = new TextDecoder();
  let e = u8.length - 22;
  while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error("Bukan file .docx yang valid (zip rusak).");
  const entries = new Map();
  for (let n = dv.getUint16(e + 10, true), p = dv.getUint32(e + 16, true); n > 0; n--) {
    const nameLen = dv.getUint16(p + 28, true);
    entries.set(td.decode(u8.subarray(p + 46, p + 46 + nameLen)), {
      method: dv.getUint16(p + 10, true), size: dv.getUint32(p + 20, true), off: dv.getUint32(p + 42, true),
    });
    p += 46 + nameLen + dv.getUint16(p + 30, true) + dv.getUint16(p + 32, true);
  }
  return async (name) => {
    const f = entries.get(name);
    if (!f) return null;
    const start = f.off + 30 + dv.getUint16(f.off + 26, true) + dv.getUint16(f.off + 28, true);
    const raw = u8.subarray(start, start + f.size);
    if (f.method === 0) return raw;
    const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  };
}

// Crop → flip → rotasi, urutan yang sama (canvas).
async function transformImage(blob, s, type) {
  try {
    const bmp = await createImageBitmap(blob);
    const sx = Math.min(Math.max(Math.round(bmp.width * s.l), 0), bmp.width - 1);
    const sy = Math.min(Math.max(Math.round(bmp.height * s.t), 0), bmp.height - 1);
    const sw = Math.min(Math.max(Math.round(bmp.width * (1 - s.l - s.r)), 1), bmp.width - sx);
    const sh = Math.min(Math.max(Math.round(bmp.height * (1 - s.t - s.b)), 1), bmp.height - sy);
    const rad = (s.rot * Math.PI) / 180, c = Math.abs(Math.cos(rad)), n = Math.abs(Math.sin(rad));
    const W = Math.round(sw * c + sh * n), H = Math.round(sw * n + sh * c);
    const cv = new OffscreenCanvas(W, H), g = cv.getContext("2d");
    if (s.rot % 90) { g.fillStyle = "#fff"; g.fillRect(0, 0, W, H); } // sudut miring → pojok putih
    g.translate(W / 2, H / 2); g.rotate(rad); g.scale(s.fh ? -1 : 1, s.fv ? -1 : 1);
    g.drawImage(bmp, sx, sy, sw, sh, -sw / 2, -sh / 2, sw, sh);
    return await cv.convertToBlob({ type: type === "image/jpeg" ? type : "image/png", quality: 0.92 });
  } catch { return blob; } // gagal decode/transform → pakai gambar asli
}

async function convertDocx(buf) {
  const read = isPdfBuffer(buf) ? await pdfDocxReader(buf) : await openZip(buf), td = new TextDecoder(), { w: W, a: A, r: R, mc: MC, v: V } = DOCX_NS;
  const readXml = async (name) => {
    const b = await read(name);
    if (!b) return null;
    const xmlText = td.decode(b);
    const d = new DOMParser().parseFromString(name === "word/document.xml" ? markHighlightsInXml(xmlText) : xmlText, "application/xml");
    if (d.getElementsByTagName("parsererror").length) throw new Error(`XML rusak di ${name}.`);
    return d;
  };
  const [doc, stylesDoc, numDoc, relsDoc] = await Promise.all([
    readXml("word/document.xml"), readXml("word/styles.xml"), readXml("word/numbering.xml"), readXml("word/_rels/document.xml.rels"),
  ]);
  if (!doc) throw new Error("Bukan file .docx yang valid (word/document.xml tidak ada).");

  const tag = (el, name) => el.getElementsByTagNameNS(W, name);
  const wattr = (el, name) => el?.getAttributeNS(W, name);
  const val = (el, name) => wattr(tag(el, name)[0], "val");
  const kids = (el, name) => [...el.children].filter((c) => c.namespaceURI === W && c.localName === name);

  // Style (nama + penomoran bawaan style) dan tipe list (angka vs bullet).
  const styles = new Map();
  if (stylesDoc) for (const s of tag(stylesDoc, "style")) {
    const np = tag(s, "numPr")[0];
    styles.set(wattr(s, "styleId"), { name: val(s, "name") || "", numId: np && val(np, "numId"), ilvl: np && val(np, "ilvl") });
  }
  const numFmt = new Map(), numAbs = new Map();
  if (numDoc) {
    for (const an of tag(numDoc, "abstractNum")) for (const l of tag(an, "lvl")) numFmt.set(`${wattr(an, "abstractNumId")}:${wattr(l, "ilvl")}`, val(l, "numFmt"));
    for (const n of tag(numDoc, "num")) numAbs.set(wattr(n, "numId"), val(n, "abstractNumId"));
  }

  // Gambar: kumpulkan spec (rel id + crop/rotasi/flip) unik, blob dibuat sesudahnya.
  const specs = [], specIdx = new Map();
  const addImage = (rid, blip) => {
    const fill = blip?.parentNode, xf = fill?.parentNode?.getElementsByTagNameNS(A, "xfrm")[0];
    const sr = fill && [...fill.children].find((c) => c.localName === "srcRect");
    const crop = (n) => Math.max(0, (+sr?.getAttribute(n) || 0) / 100000);
    const s = { rid, l: crop("l"), t: crop("t"), r: crop("r"), b: crop("b"),
      rot: (+xf?.getAttribute("rot") || 0) / 60000, fh: xf?.getAttribute("flipH") === "1", fv: xf?.getAttribute("flipV") === "1" };
    const key = JSON.stringify(s);
    if (!specIdx.has(key)) { specIdx.set(key, specs.length); specs.push(s); }
    return specIdx.get(key);
  };

  // <w:p> → { heading, skip, ordered, segs:[{text, imgs}] }; segs dipecah di tiap line-break.
  const readPara = (p) => {
    const ppr = kids(p, "pPr")[0], sid = ppr && val(ppr, "pStyle"), st = styles.get(sid);
    const hm = /^Heading(\d)$/.exec(sid || "") || /^heading (\d)$/i.exec(st?.name || "");
    const np = ppr && tag(ppr, "numPr")[0];
    const numId = np ? val(np, "numId") : st?.numId, ilvl = (np ? val(np, "ilvl") : st?.ilvl) || "0";
    const fmt = numId && numId !== "0" ? numFmt.get(`${numAbs.get(numId)}:${ilvl}`) : undefined;
    const segs = [{ text: "", imgs: [] }];
    for (const el of p.getElementsByTagName("*")) {
      const cur = segs[segs.length - 1], ln = el.localName;
      if (el.namespaceURI === W) {
        if (ln === "t") cur.text += el.textContent;
        else if (ln === "tab") cur.text += "\t";
        else if (ln === "br" && [null, "", "textWrapping"].includes(wattr(el, "type"))) segs.push({ text: "", imgs: [] });
      } else if (el.namespaceURI === A && ln === "blip") {
        const rid = el.getAttributeNS(R, "embed");
        if (rid) cur.imgs.push(addImage(rid, el));
      } else if (el.namespaceURI === V && ln === "imagedata") {
        const rid = el.getAttributeNS(R, "id");
        if (rid) cur.imgs.push(addImage(rid, null));
      }
    }
    return { heading: !!hm && +hm[1] <= 3, skip: !!hm && +hm[1] > 3, ordered: fmt !== undefined && fmt !== "bullet" && ilvl === "0", segs };
  };
  const walk = (parent) => {
    const out = [];
    for (const c of parent.children) {
      if (c.namespaceURI !== W) continue;
      if (c.localName === "p") out.push(readPara(c));
      else if (c.localName === "sdt") out.push(...walk(kids(c, "sdtContent")[0] || c));
      else if (c.localName === "tbl") out.push({ tbl: kids(c, "tr").map((tr) => kids(tr, "tc").map(walk)) });
    }
    return out;
  };
  // Word membungkus gambar di mc:AlternateContent (Choice + Fallback) → buang Fallback biar tidak dobel.
  for (const f of [...doc.getElementsByTagNameNS(MC, "Fallback")]) f.remove();
  const blocks = walk(tag(doc, "body")[0]);

  const rels = new Map();
  if (relsDoc) for (const r of relsDoc.getElementsByTagName("Relationship")) rels.set(r.getAttribute("Id"), r.getAttribute("Target"));
  const skippedExt = new Set();
  const blobs = await Promise.all(specs.map(async (s) => {
    const target = rels.get(s.rid);
    if (!target) return null;
    const path = decodeURIComponent(new URL(target, "http://x/word/document.xml").pathname.slice(1));
    const ext = path.split(".").pop().toLowerCase(), type = IMG_MIME[ext];
    const bytes = type && (await read(path));
    if (!bytes) { skippedExt.add(ext); return null; }
    const blob = new Blob([bytes], { type });
    return s.l || s.t || s.r || s.b || s.rot || s.fh || s.fv ? transformImage(blob, s, type) : blob;
  }));

  // ── blok → baris {text, images, isHeading, isListItem} ──
  const flat = (bl) => bl.flatMap((b) => (b.tbl ? b.tbl.flat().flatMap(flat) : [b]));
  const paraLines = (b) => b.skip ? [] : b.segs
    .map((s, i) => ({ text: s.text.trim(), images: s.imgs.filter((k) => blobs[k]), isHeading: b.heading, isListItem: b.ordered && i === 0 }))
    .filter((l) => l.text || l.images.length);

  // ── Tabel opsi gambar (5 kolom A–E): baris 1 = huruf, baris 2 = gambar tiap opsi, baris 3 = {penjelasan} ──
  const OPT_LETTERS = ["A", "B", "C", "D", "E"];
  const cellText = (cell) => cell.flatMap((b) => (b.segs ? b.segs.map((s) => s.text) : [])).join(" ").replace(/\s+/g, " ").trim();
  const cellImg = (cell) => cell.flatMap((b) => (b.segs ? b.segs.flatMap((s) => s.imgs) : [])).find((k) => blobs[k] !== undefined);
  const isOptTbl = (rows) => !!rows[0] && rows[0].length === OPT_LETTERS.length &&
    rows[0].every((c, i) => cellText(c).replace(/[.)]$/, "").toUpperCase() === OPT_LETTERS[i]);
  const optTableOf = (rows) => Object.fromEntries(OPT_LETTERS.map((L, i) => {
    const pic = (rows[1] || [])[i] || [], exp = (rows[2] || [])[i] || [];
    const body = parseOptionBody(cellText(exp));
    return [L, { text: cellText(pic), image: cellImg(pic), exp: body.exp || body.text }];
  }));
  // Tabel opsi jadi satu baris khusus { optTable } untuk parser Bagian 1.
  const lineOf = (bl) => bl.flatMap((b) => {
    if (!b.tbl) return paraLines(b);
    if (isOptTbl(b.tbl)) return [{ text: "", images: [], isHeading: false, isListItem: false, optTable: optTableOf(b.tbl) }];
    return b.tbl.flat().flatMap(lineOf);
  });

  // Bagian 2 = mulai dari heading "Bagian 2"/"Gagal Diperbaiki" terakhir; tanpa heading itu, mulai dari tabel pertama.
  // Bagian 3 = mulai dari heading "Bagian 3"/"Soal Isian" terakhir (kalau ada).
  let cut = -1, cut3 = -1;
  blocks.forEach((b, i) => {
    if (!b.heading) return;
    const t = b.segs.map((s) => s.text).join("").trim();
    if (/bagian\s*2|gagal\s+diperbaiki/i.test(t)) cut = i;
    if (/bagian\s*3|soal\s+isian/i.test(t)) cut3 = i;
  });
  if (cut < 0) {
    // Tanpa heading Bagian 2: tabel pertama = Bagian 2 — tapi jangan lewati
    // heading Bagian 3 kalau sudah ketemu, atau tabel isian ikut kesedot ke sini.
    const searchEnd = cut3 >= 0 ? cut3 : blocks.length;
    cut = blocks.findIndex((b, i) => b.tbl && !isOptTbl(b.tbl) && i < searchEnd);
  }
  const part1 = cut < 0 ? blocks : blocks.slice(0, cut);
  const part2 = cut < 0 ? [] : blocks.slice(cut, cut3 < 0 ? blocks.length : cut3);
  const part3 = cut3 < 0 ? [] : blocks.slice(cut3);

  // ── Bagian 1: soal MCQ (parser Bagian 1) ──
  // Fallback: soal + opsi + kunci kadang ada dalam SATU paragraf tanpa line-break.
  // Penjelasan per opsi ada di dalam {...} di akhir baris opsi.
  function parseOptionBody(raw) {
    const i = raw.indexOf("{");
    if (i < 0) return { text: raw.trim(), exp: "", open: false };
    const j = raw.indexOf("}", i);
    const text = raw.slice(0, i).trim();
    if (j < 0) return { text, exp: raw.slice(i + 1).trim(), open: true };
    return { text, exp: raw.slice(i + 1, j).trim(), open: false };
  }

  function splitInlineQuestion(rawText) {
    let text = rawText, answer = "";
    const ansMatch = text.match(/\bKunci(?:\s*Jawaban)?\s*:?\s*([A-Ea-e])\b\s*$/i);
    if (ansMatch) { answer = ansMatch[1].toUpperCase(); text = text.slice(0, ansMatch.index).trim(); }
    const matches = [...text.matchAll(/\s([A-Ea-e])[.)]\s+/g)];
    if (matches.length < 3 || matches[0][1].toUpperCase() !== "A") return null;
    const options = {}, optionExplanations = {};
    matches.forEach((m, i) => {
      const end = i + 1 < matches.length ? matches[i + 1].index : text.length;
      const body = parseOptionBody(text.slice(m.index + m[0].length, end));
      options[m[1].toUpperCase()] = body.text;
      if (body.exp) optionExplanations[m[1].toUpperCase()] = body.exp;
    });
    return { question: text.slice(0, matches[0].index).trim(), options, answer, optionExplanations };
  }

  function parsePart1(lines) {
    const questions = [];
    let current = null, pendingId = null, currentCategory = "", mode = null, pendingOpt = null;
    const questionStart = /^(\d+)[.)]\s*(.*)$/, idLine = /^ID\s*:\s*(.+)$/i, optionLine = /^([A-Ea-e])[.)]\s*(.*)$/;
    const answerLine = /^(?:Kunci\s*Jawaban|Jawaban\s*Kunci|Kunci|Jawaban)\s*:?\s*([A-Ea-e])\b.*$/i;
    const explanationLine = /^(?:Gambar\s+)?Penjelasan\s*:?\s*(.*)$/i, categoryLine = /^Kategori\s*:\s*(.+)$/i;
    const startQuestion = (rawText, images) => {
      if (current) questions.push(finishHighlightQuestion(current));
      const inline = splitInlineQuestion(rawText);
      current = {
        id: pendingId || `Q${questions.length + 1}`, category: currentCategory,
        question: inline ? inline.question : rawText, questionImages: [...images],
        options: inline ? inline.options : {}, optionExplanations: inline ? inline.optionExplanations : {}, answer: inline ? inline.answer : "",
        explanation: "", explanationImages: [], isBroken: false,
      };
      pendingId = null;
      mode = inline ? "answer" : "question";
    };
    for (const rawLine of lines) {
      if (rawLine.optTable) { // tabel opsi gambar: isi A–E sekaligus
        pendingOpt = null;
        if (current) {
          for (const L of OPT_LETTERS) {
            const o = rawLine.optTable[L];
            current.options[L] = o.text;
            if (o.image !== undefined) {
              current.optionImages = current.optionImages || {};
              current.optionImages[L] = o.image;
            }
            if (o.exp) current.optionExplanations[L] = o.exp;
          }
          mode = "options";
        }
        continue;
      }
      const hl = rawLine.text.startsWith(HL_MARK); // baris ini di-highlight (penanda kunci)
      const { images, isHeading, isListItem } = rawLine;
      const text = hl ? rawLine.text.slice(HL_MARK.length).trimStart() : rawLine.text;
      if (pendingOpt && current) {
        const close = text.indexOf("}");
        const chunk = close < 0 ? text : text.slice(0, close);
        current.optionExplanations[pendingOpt] = `${current.optionExplanations[pendingOpt] || ""} ${chunk}`.trim();
        current.explanationImages.push(...images);
        if (close >= 0) pendingOpt = null;
        continue;
      }
      if (/^Sumber\s*:/i.test(text)) continue;
      if (isHeading) { currentCategory = text; continue; }
      if (categoryLine.test(text)) { currentCategory = text.match(categoryLine)[1].trim(); continue; }
      if (idLine.test(text)) { pendingId = text.match(idLine)[1].trim(); continue; }
      if (isListItem) { startQuestion(text, images); continue; }
      const qStart = text.match(questionStart);
      if (qStart) { startQuestion(qStart[2].trim(), images); continue; }
      if (!current) continue;
      const optMatch = text.match(optionLine), ansMatch = text.match(answerLine), expMatch = text.match(explanationLine);
      if (optMatch) {
        const letter = optMatch[1].toUpperCase();
        const body = parseOptionBody(optMatch[2]);
        current.options[letter] = body.text;
        if (body.exp) current.optionExplanations[letter] = body.exp;
        if (body.open) pendingOpt = letter;
        if (hl) current.highlight = letter;
        current.questionImages.push(...images);
        mode = "options";
      } else if (ansMatch) {
        current.answer = ansMatch[1].toUpperCase();
        mode = "answer";
      } else if (expMatch) {
        current.explanation = expMatch[1].trim();
        current.explanationImages.push(...images);
        mode = "explanation";
      } else if (mode === "question") {
        current.question += (current.question ? " " : "") + text;
        current.questionImages.push(...images);
      } else if (mode === "explanation") {
        current.explanation += (current.explanation ? " " : "") + text;
        current.explanationImages.push(...images);
      } else if (mode === "options" && images.length) {
        current.questionImages.push(...images);
      }
    }
    if (current) questions.push(finishHighlightQuestion(current));
    return questions;
  }

  // ── Bagian 2: tabel soal rusak | No | Soal Asli | Gambar Penjelasan | ──
  function parsePart2(tables, startingQNumber) {
    const broken = [];
    for (const rows of tables) {
      let isFirstRow = true;
      for (const cells of rows) {
        if (cells.length < 2) continue;
        const lines = cells.map((c) => flat(c).flatMap(paraLines));
        const text = (i) => lines[i].map((l) => l.text).filter(Boolean).join(" ");
        const images = (i) => (lines[i] || []).flatMap((l) => l.images);
        const origNo = text(0), questionText = text(1);
        if (isFirstRow || /soal\s+asli|gambar\s+penjelasan/i.test(questionText) || /^no\.?$/i.test(origNo)) {
          isFirstRow = false;
          if (!/^\d+$/.test(origNo)) continue; // header, bukan baris data
        }
        if (!questionText) continue;
        broken.push({
          id: `QB${origNo || startingQNumber + broken.length + 1}`, category: "Soal Rusak", question: questionText,
          questionImages: images(1), options: {}, answer: "", explanation: "", explanationImages: images(2), explanationText: (lines[2] || []).map((l) => l.text).filter(Boolean), isBroken: true,
        });
      }
    }
    return broken;
  }

  // ── Bagian 3: tabel soal isian | No | Soal | Jawaban | ──
  function parsePart3(tables, startingQNumber) {
    const isian = [];
    for (const rows of tables) {
      let isFirstRow = true;
      for (const cells of rows) {
        if (cells.length < 2) continue;
        const lines = cells.map((c) => flat(c).flatMap(paraLines));
        const text = (i) => lines[i].map((l) => l.text).filter(Boolean).join(" ");
        const images = (i) => (lines[i] || []).flatMap((l) => l.images);
        const origNo = text(0), questionText = text(1), jawabanText = text(2);
        if (isFirstRow || /^no\.?$/i.test(origNo)) {
          isFirstRow = false;
          if (!/^\d+$/.test(origNo)) continue; // header, bukan baris data
        }
        if (!questionText) continue;
        isian.push({
          id: `QI${origNo || startingQNumber + isian.length + 1}`, category: "Soal Isian", question: questionText,
          questionImages: images(1), options: {}, answer: jawabanText || "", explanation: "", explanationImages: [],
          isBroken: false, isIsian: true,
        });
      }
    }
    return isian;
  }

  const normal = parsePart1(lineOf(part1));
  const rusak = parsePart2(part2.filter((b) => b.tbl && !isOptTbl(b.tbl)).map((b) => b.tbl), normal.length);
  const isian = parsePart3(part3.filter((b) => b.tbl && !isOptTbl(b.tbl)).map((b) => b.tbl), normal.length + rusak.length);
  return { questions: [...normal, ...rusak, ...isian], blobs, stats: { normal: normal.length, rusak: rusak.length, isian: isian.length, images: blobs.filter(Boolean).length, skippedExt: [...skippedExt] } };
}

// ── Audio (benar/salah) ──────────────────────────────────────────────────

// Coba load audio/manifest.js secara dinamis (non-blocking) — kalau 404,
// pool tetap kosong dan suara hanya tidak bunyi, halaman tidak crash.
let benarPool = [];
let salahPool = [];
function buildAudioPool(folder, fileNames) {
  return (fileNames || []).map((name) => new Audio(`./audio/${folder}/${name}`));
}
(function loadAudioManifest() {

    s.src = "./audio/manifest.js";

// ── P5 sword stab: diagonal, nancep tepat di tombol jawaban, fade out di tempat ──
function playSwordStab(swordEl, targetBtn) {
  // Hentikan animasi yang lagi jalan (kalau ada) SEBELUM mulai yang baru —
  // ini kunci fix "kadang cuma muncul sekali": dulu pakai banyak setTimeout
  // yang numpuk & saling motong; element.animate() + cancel() gak punya
  // masalah itu karena tiap panggilan selalu instance animasi baru & bersih.
  if (swordEl._swordAnim) {
    try { swordEl._swordAnim.cancel(); } catch (e) {}
    swordEl._swordAnim = null;
  }

  // Titik target: tengah tombol yang diklik (fallback tengah layar kalau gak ketemu)
  let targetX = window.innerWidth / 2;
  let targetY = window.innerHeight / 2;
  try {
    if (targetBtn) {
      const rect = targetBtn.getBoundingClientRect();
      targetX = rect.left + rect.width * 0.62;
      targetY = rect.top + rect.height / 2;
    }
  } catch (e) {}

  // Arah tusukan: selalu dari kanan-atas ke bawah-kiri (diagonal), dengan
  // sedikit variasi acak tiap kali biar gak identik-identik amat.
  const jitter = (Math.random() - 0.5) * 18; // -9..+9 deg variasi arah
  const travelDeg = 135 + jitter; // 135deg = arah kanan-atas -> kiri-bawah (sistem sumbu y ke bawah)
  const dist = Math.max(420, window.innerWidth * 0.5);
  const rad = (travelDeg * Math.PI) / 180;
  const startOffsetX = -Math.cos(rad) * dist; // titik AWAL relatif ke target
  const startOffsetY = -Math.sin(rad) * dist;

  // Gambar sword.png: ujung mata pedang menghadap ke BAWAH (90deg di sistem
  // layar). Supaya ujungnya yang mimpin arah gerak (bukan gagangnya),
  // rotasi elemen = arah tempuh - 90deg.
  const rotateDeg = travelDeg - 90;

  // Elemen di-anchor lewat left/top di titik UJUNG mata pedang (bukan pojok
  // kotak gambar), match dengan transform-origin: 52% 99% di CSS + height:130px
  // tetap di markup. Karena rotate/scale muter di titik itu (transform-origin)
  // dan translate() selalu jalan di ruang layar (di luar rotate/scale), ujung
  // pedang bakal selalu pas nancep di targetX/targetY di ujung animasi,
  // berapa pun sudut rotasinya.
  const SWORD_TIP_OFFSET_X = 38.4; // 52% dari lebar render (height:150px, rasio asli 136:276)
  const SWORD_TIP_OFFSET_Y = 148.5; // 99% dari tinggi render (150px)
  swordEl.style.left = (targetX - SWORD_TIP_OFFSET_X) + "px";
  swordEl.style.top = (targetY - SWORD_TIP_OFFSET_Y) + "px";

  const scaleImpact = 1.1;
  const TOTAL_DURATION = 1650; // ms — sebelumnya 900ms, kerasa sekilas doang
  // Revisi timing (fix laporan "fade in & fade out kecepetan"):
  // PENTING — akar masalah sebenarnya bukan cuma di offset keyframe, tapi di
  // easing GLOBAL yang lama: "cubic-bezier(0.16, 0.9, 0.2, 1)" dipasang di
  // level animate() (bukan per-keyframe). Itu artinya SELURUH timeline
  // (bukan cuma transform-nya) ikut dibengkokkan kurva itu — dan kurva itu
  // "ngebut" ke ~90% progress cuma dalam ~16% durasi lalu landai. Akibatnya
  // walau offset 0.34→0.74 didesain buat "diem lama", posisi efektifnya di
  // waktu asli ke-geser jauh ke depan (hampir seketika), jadi yang kelihatan
  // di layar cuma: numongol sekilas → langsung mulai pudar. Fix-nya: easing
  // top-level di-set "linear" (waktu asli = offset apa adanya), dan variasi
  // percepatan/perlambatan gerak sekarang ditaruh PER-KEYFRAME (easing di tiap
  // titik cuma ngaruh ke interpolasi menuju keyframe berikutnya, gak
  // ngebengkokin keseluruhan timeline). Hasilnya offset 0.34–0.74 beneran
  // holdnya di rentang waktu asli ~560ms–1220ms, bukan kepotong duluan.
  const keyframes = [
    { opacity: 0, transform: `translate(${startOffsetX}px, ${startOffsetY}px) rotate(${rotateDeg}deg) scale(0.5)`, offset: 0, easing: "cubic-bezier(0.3, 0, 0.6, 1)" },
    { opacity: 0.55, transform: `translate(${startOffsetX * 0.62}px, ${startOffsetY * 0.62}px) rotate(${rotateDeg}deg) scale(0.7)`, offset: 0.1, easing: "ease-out" },
    { opacity: 1, transform: `translate(${startOffsetX * 0.22}px, ${startOffsetY * 0.22}px) rotate(${rotateDeg}deg) scale(0.85)`, offset: 0.18, easing: "ease-out" },
    { opacity: 1, transform: `translate(0px, 0px) rotate(${rotateDeg}deg) scale(${scaleImpact})`, offset: 0.34, easing: "ease-out" },
    { opacity: 1, transform: `translate(0px, 0px) rotate(${rotateDeg}deg) scale(1)`, offset: 0.42, easing: "linear" },
    { opacity: 1, transform: `translate(0px, 0px) rotate(${rotateDeg}deg) scale(1)`, offset: 0.74, easing: "ease-in" },
    { opacity: 0, transform: `translate(0px, 0px) rotate(${rotateDeg}deg) scale(1)`, offset: 1 }
  ];
  try {
    swordEl._swordAnim = swordEl.animate(keyframes, {
      duration: TOTAL_DURATION,
      easing: "linear", // waktu beneran linear, biar offset di atas gak kebengkok lagi
      fill: "forwards",
    });
    swordEl._swordAnim.onfinish = () => { swordEl._swordAnim = null; };
  } catch (e) { /* browser lama tanpa Web Animations API — diam aja, gak fatal */ }

  // ── Impact flash: nyala sekilas pas ujung pedang nyampe (offset 0.34) ──
  playSwordFlash(targetX, targetY, TOTAL_DURATION * 0.34);
}

// Ledakan cahaya kecil pas titik impact, biar momen "nancep"-nya kerasa
// jelas walau pedangnya sendiri banyak area hitam pekat.
function playSwordFlash(x, y, delayMs) {
  const flashEl = document.getElementById("p5SwordFlash");
  if (!flashEl) return;
  if (flashEl._flashAnim) {
    try { flashEl._flashAnim.cancel(); } catch (e) {}
    flashEl._flashAnim = null;
  }
  flashEl.style.left = x + "px";
  flashEl.style.top = y + "px";
  const flashKeyframes = [
    { opacity: 0, transform: "scale(0.2)", offset: 0 },
    { opacity: 1, transform: "scale(1.3)", offset: 0.25 },
    { opacity: 0.85, transform: "scale(1.1)", offset: 0.4 },
    { opacity: 0, transform: "scale(1.4)", offset: 1 }
  ];
  try {
    flashEl._flashAnim = flashEl.animate(flashKeyframes, {
      duration: 500,
      delay: Math.max(0, delayMs),
      easing: "ease-out",
      fill: "forwards",
    });
    flashEl._flashAnim.onfinish = () => { flashEl._flashAnim = null; };
  } catch (e) { /* noop */ }
}

// ── P5 Mode: Ransom/cutout letter effect ──────────────────────────────────
// Called after render() in P5 mode. Wraps heading/label text in per-char
// spans. Chars at positions determined by a lightweight hash get the
// red-box invert treatment — looks like cut-out ransom note letters.
// NEVER applied to question text, option text, or image containers.
function p5RansomifyEl(el) {
  if (!el || el.dataset.p5r === "1") return; // already done
  const text = el.textContent;
  if (!text.trim()) return;
  // Deterministic "random" selection: pick ~1 in 3 chars using char code sum
  let out = "";
  let charIdx = 0;
  for (const ch of text) {
    if (ch === " " || ch === "\n") {
      out += '<span class="p5rc p5rc-space"> </span>';
    } else {
      // Use char code + position hash to decide invert — not every Nth, more organic
      const hash = (ch.charCodeAt(0) * 13 + charIdx * 7) % 11;
      const isInv = hash < 3; // ~27% of chars get inverted
      out += isInv
        ? `<span class="p5rc p5rc-inv" aria-hidden="true">${ch}</span>`
        : `<span class="p5rc">${ch}</span>`;
      charIdx++;
    }
  }
  el.innerHTML = out;
  el.dataset.p5r = "1";
}

function p5ApplyRansom() {
  if (theme !== "p5") return;
  // Only target decorative headings — NOT question text or answer options
  const selectors = [
    ".sectionLabel",
    ".catName",
    ".pickerHeader h1",
    ".doneBanner .title",
    ".scoreHero .gradeLabel",
    ".reviewLabel",
    ".pkgSubtitle",
  ];
  selectors.forEach(sel => {
    document.querySelectorAll(sel).forEach(el => {
      el.classList.add("p5-ransom");
      p5RansomifyEl(el);
    });
  });
}

// ── Custom Quiz: 1 kuis dari .docx, diingat di IndexedDB ─────────────────
// Kuis TIDAK ditulis ke file/server. Satu slot di IndexedDB browser (gambar
// sebagai Blob apa adanya) — tetap ada sampai user ganti/hapus. Kalau
// IndexedDB gagal/diblokir, kuis tetap jalan di sesi ini, cuma tidak diingat.
let dbPromise;
function idb(mode, run) {
  dbPromise ??= new Promise((ok, no) => {
    const req = indexedDB.open("soalin-custom", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("kv");
    req.onsuccess = () => ok(req.result);
    req.onerror = () => no(req.error);
  });
  return dbPromise.then((db) => new Promise((ok, no) => {
    const tx = db.transaction("kv", mode), rq = run(tx.objectStore("kv"));
    tx.oncomplete = () => ok(rq.result);
    tx.onerror = tx.onabort = () => no(tx.error);
  }));
}

const customPkg = (rec) => rec && { id: CUSTOM_PREFIX + rec.id, title: rec.title, category: "Custom Quiz", custom: true, recId: rec.id };
const customRec = (recId) => customQuizzes.find((r) => r.id === recId) || null;
const isCustomId = (id) => typeof id === "string" && id.startsWith(CUSTOM_PREFIX);

}

// Rekaman IndexedDB → soal siap main (index gambar diganti object URL).
function prepareCustomQs(rec) {
  customUrls.forEach((u) => u && URL.revokeObjectURL(u));
  const urls = rec.blobs.map((b) => b && URL.createObjectURL(b));
  customUrls = urls;
  const pick = (idxs) => idxs.map((i) => urls[i]);
  const pickOpt = (o) => (o ? Object.fromEntries(Object.entries(o).map(([L, i]) => [L, urls[i]])) : undefined);
  return rec.questions.map((q) => ({ ...q, questionImages: pick(q.questionImages), explanationImages: pick(q.explanationImages), optionImages: pickOpt(q.optionImages) }));
}

// Muat semua kuis custom dari IndexedDB. Kunci "custom" (format lama, 1 kuis) ikut dibaca.
async function loadCustom() {
  customQuizzes = [];
  try {
    const keys = await idb("readonly", (st) => st.getAllKeys());
    for (const key of keys) {
      if (!(key === "custom" || (typeof key === "string" && key.startsWith("cq:")))) continue;
      const rec = await idb("readonly", (st) => st.get(key));
      if (rec?.questions) customQuizzes.push({ ...rec, id: rec.id || "legacy", key });
    }
    customQuizzes.sort((a, b) => b.savedAt - a.savedAt);
  } catch { /* IndexedDB diblokir → daftar kosong */ }
}

// Pilih/seret satu atau beberapa file → konversi → simpan sebagai kuis baru (tidak menimpa kuis lain).
async function handleDocx(fileList) {
  const files = [...fileList].filter((f) => /\.(docx|pdf)$/i.test(f.name));
  pickerOpen = true; // pesan (proses/gagal) harus kelihatan walau lagi di tengah kuis
  if (!files.length) { dropMsg = "⚠️ Pilih file Word (.docx) atau PDF (.pdf)."; render(); return; }
  const msgs = [];
  let last = null;
  for (const file of files) {
    dropMsg = [...msgs, `⏳ Mengonversi ${file.name}…`].join("\n");
    render();
    try {
      const { questions, blobs, stats } = await convertDocx(await file.arrayBuffer());
      if (!stats.normal && !stats.rusak && !stats.isian) throw new Error("Tidak ada soal terdeteksi. Format: 1. Soal / A. … E. / Kunci: X / {penjelasan}");
      const rec = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), title: file.name.replace(/\.(docx|pdf)$/i, ""), questions, blobs, savedAt: Date.now() };
      let saved = true;
      await idb("readwrite", (st) => st.put(rec, "cq:" + rec.id)).catch(() => { saved = false; });
      customQuizzes.unshift({ ...rec, key: "cq:" + rec.id });
      clearCustomProgress(rec.id);
      last = rec;
      const skipped = stats.skippedExt.length ? ` ⚠️ gambar .${stats.skippedExt.join(", .")} dilewati (browser tidak bisa menampilkan)` : "";
      msgs.push(`✅ ${file.name}: ${stats.normal} soal${stats.rusak ? ` + ${stats.rusak} soal rusak` : ""}${stats.isian ? ` + ${stats.isian} soal isian` : ""}, ${stats.images} gambar${skipped}${saved ? "" : " ⚠️ tidak tersimpan (IndexedDB)"}`);
    } catch (e) {
      msgs.push(`❌ ${file.name}: ${e instanceof ReferenceError ? "Browser terlalu lama (butuh DecompressionStream). Pakai Chrome/Edge/Firefox/Safari terbaru." : e.message}`);
    }
  }
  dropMsg = msgs.join("\n");
  // Satu file yang sukses langsung dimainkan; banyak file → tetap di pemilih paket.
  if (files.length === 1 && last) {
    await selectPackage(customPkg(last));
    pickerOpen = msgs[0].includes("⚠️");
  }
  render();
}

async function deleteCustom(recId) {
  const rec = customRec(recId);
  if (!rec || !confirm(`Hapus kuis custom "${rec.title}"?\nProgresnya ikut hilang.`)) return;
  const wasActive = activePackage?.id === CUSTOM_PREFIX + recId;
  customQuizzes = customQuizzes.filter((r) => r.id !== recId);
  clearCustomProgress(recId);
  await idb("readwrite", (st) => st.delete(rec.key)).catch(() => {});
  if (wasActive) {
    allQuestions = [];
    activePackage = null;
    try { localStorage.removeItem(ACTIVE_PKG_KEY); } catch { /* noop */ }
    resetQuizStateForNewPackage();
  }
  dropMsg = "🗑️ Kuis custom dihapus.";
  pickerOpen = true;
  render();
}

// ── Init Mode Latihan dari localStorage ──────────────────────────────────
function initBiasa() {
  const saved = loadBiasa();

  // belum pernah punya progres tersimpan, state paket sebelumnya (yang
  // masih ada di memory) tidak ikut kebawa / "bocor" ke paket baru.
  biasaShuffleOn = false;
  biasaAnswersMap = {};
  if (saved) {
    biasaShuffleOn = !!saved.shuffleOn;
    biasaAnswersMap = saved.answersMap || {};
  }
  biasaVisibleCount = LOAD_BATCH;
  biasaLoaded = true;
}

// ── Mode Latihan: hitung daftar soal aktif (shuffle) ─────────────────────
function computeBiasaAll() {
  const key = "__shuffle";
  if (!biasaShuffleOn) {
    delete shuffleOrderCache[key];
    return allQuestions;
  }
  const cached = shuffleOrderCache[key];
  const baseIds = new Set(allQuestions.map(q => q.id));
  if (cached && cached.length === allQuestions.length && cached.every(q => baseIds.has(q.id))) return cached;
  const shuffled = shuffleArray(allQuestions);
  shuffleOrderCache[key] = shuffled;
  return shuffled;
}

// ── Mode Latihan: handlers ───────────────────────────────────────────────
function handleResetBiasa() {
  clearBiasa();
  biasaAnswersMap = {};
  biasaVisibleCount = LOAD_BATCH;
  shuffleOrderCache = {};
  render();
}
function handleBiasaShuffleToggle() {
  biasaShuffleOn = !biasaShuffleOn;
  biasaVisibleCount = LOAD_BATCH;
  saveBiasa();
  render();
}
function handleBiasaLoadMore() {
  const allQ = computeBiasaAll();
  biasaVisibleCount = Math.min(biasaVisibleCount + LOAD_BATCH, allQ.length);
  render();
}
function handleAnswerBiasa(qId, letter) {
  if (biasaAnswersMap[qId] !== undefined && biasaAnswersMap[qId] !== null) return;
  const q = allQuestions.find(x => x.id === qId);
  biasaAnswersMap[qId] = letter;
  saveBiasa();
  playSound(!!q && letter === q.answer);
  render();
}
// Soal isian tidak dinilai benar/salah lewat pencocokan teks — jawaban apa pun
// dianggap benar (audio + badge "benar"), lalu kartu mereveal kunci jawaban.
// Sekali terjawab, tidak bisa diedit (kecuali Reset).
function handleAnswerIsian(qId, text) {
  if (biasaAnswersMap[qId] !== undefined && biasaAnswersMap[qId] !== null) return;
  const trimmed = (text || "").trim();
  if (!trimmed) return;
  biasaAnswersMap[qId] = trimmed;
  saveBiasa();
  playSound(true);
  render();
}

// ── Mode Tentamen: handlers ──────────────────────────────────────────────
function stopTentamenTimerLoop() {
  if (tentamenTimerHandle) { clearInterval(tentamenTimerHandle); tentamenTimerHandle = null; }
  if (tentamenAdvanceHandle) { clearTimeout(tentamenAdvanceHandle); tentamenAdvanceHandle = null; }
}
function startTentamenTimerLoop() {
  stopTentamenTimerLoop();
  tentamenTimerHandle = setInterval(() => {
    if (quizMode !== "tentamen" || tentamenState !== "running" || qPhase !== "answering") return;
    if (tentamenDifficulty === "bekicot") return; // no timer
    if (timeLeft <= 1) {
      timeLeft = 0;
      tentamenAnswers[currentIdx] = "skipped";
      qPhase = "answered_timeout";
      render();
      tentamenAdvanceHandle = setTimeout(advanceOrFinish, 1800);
    } else {
      timeLeft -= 1;
      updateTimerDOM();
    }
  }, 1000);
}

// ── Update tampilan timer secara langsung (tanpa render ulang seluruh halaman) ──
// Ini mencegah "blink" karena kartu soal & animasi ikut dibuat ulang tiap detik.
function updateTimerDOM() {
  const cfg = DIFFICULTY_CONFIG[tentamenDifficulty];
  const maxTime = cfg.timerSeconds || 1;
  const isUrgent = timeLeft <= 10 && tentamenDifficulty !== "bekicot";
  const timerPct = (timeLeft / maxTime) * 100;
  const timerNumEl = document.getElementById("timerNum");
  const timerFillEl = document.getElementById("timerFill");
  const timerCardEl = document.getElementById("timerCard");
  const timerLabelEl = document.getElementById("timerLabel");
  if (!timerNumEl || !timerFillEl || !timerCardEl) return;

  timerNumEl.textContent = String(timeLeft).padStart(2, "0");
  timerNumEl.style.color = isUrgent ? "var(--wrong-strong)" : cfg.color;
  timerNumEl.classList.toggle("pulse", isUrgent);

  timerFillEl.style.width = timerPct + "%";
  timerFillEl.style.background = isUrgent ? "var(--wrong-strong)" : cfg.color;

  timerCardEl.classList.toggle("urgent", isUrgent);
  if (timerLabelEl) timerLabelEl.classList.toggle("urgent", isUrgent);
}
function handleStartTentamen() {
  // Soal rusak (isBroken) tidak dimasukkan ke Mode Tentamen (tidak punya konten yang valid).
  // Soal isian (isIsian) ikut disertakan — dinilai self-graded, lihat handleAnswerTentamenIsian().
  const quizzable = allQuestions.filter(q => !q.isBroken);
  const qs = tentamenShuffleOn ? shuffleArray(quizzable) : quizzable;
  if (!qs.length) return;
  tentamenQuestions = qs;
  tentamenAnswers = new Array(qs.length).fill(null);
  currentIdx = 0;
  timeLeft = DIFFICULTY_CONFIG[tentamenDifficulty].timerSeconds;
  qPhase = "answering";
  tentamenState = "running";
  render();
  startTentamenTimerLoop();
}
function handleResetTentamen() {
  tentamenState = "setup";
  tentamenQuestions = [];
  tentamenAnswers = [];
  stopTentamenTimerLoop();
  render();
}
function handleAnswerTentamen(letter) {
  if (tentamenAnswers[currentIdx] !== null && tentamenAnswers[currentIdx] !== undefined) return;
  const q = tentamenQuestions[currentIdx];
  tentamenAnswers[currentIdx] = letter;
  playSound(letter === q.answer);
  qPhase = "answered_manual";
  render();
}
// Soal isian di Tentamen — sama seperti Mode Latihan: dinilai self-graded,
// jawaban apa pun yang terisi dihitung benar begitu dikirim (lihat renderTentamenResults).
function handleAnswerTentamenIsian(text) {
  if (tentamenAnswers[currentIdx] !== null && tentamenAnswers[currentIdx] !== undefined) return;
  const trimmed = (text || "").trim();
  if (!trimmed) return;
  tentamenAnswers[currentIdx] = trimmed;
  playSound(true);
  qPhase = "answered_manual";
  render();
}
function advanceOrFinish() {
  if (tentamenAdvanceHandle) { clearTimeout(tentamenAdvanceHandle); tentamenAdvanceHandle = null; }
  if (currentIdx >= tentamenQuestions.length - 1) {
    tentamenState = "finished";
    stopTentamenTimerLoop();
  } else {
    currentIdx += 1;
    timeLeft = DIFFICULTY_CONFIG[tentamenDifficulty].timerSeconds;
    qPhase = "answering";
  }
  render();
}

// ── Mode switch ───────────────────────────────────────────────────────────
function handleModeChange(m) {
  if (m === quizMode) return;
  quizMode = m;
  if (m === "tentamen") {
    tentamenState = "setup";
    tentamenQuestions = [];
    tentamenAnswers = [];
  }
  stopTentamenTimerLoop();
  render();
}

// ── Klik opsi jawaban (delegasi, dipakai Latihan & Tentamen) ─────────────
function onOptionClick(qid, letter, btnEl) {
  // Simpen elemen tombol yang BENERAN diklik, bukan cuma huruf-nya. Di Mode
  // Latihan banyak soal tampil sekaligus di satu halaman — kalau targeting
  // sword cuma nyari ".option[data-letter=...]" lewat huruf doang, itu bakal
  // ketemu tombol pertama yang cocok di SELURUH halaman (bisa punya soal
  // lain / yang udah kescroll lewat), jadi sword-nya kayak nusuk ke tempat
  // yang gak keliatan / gak nongol sama sekali di Mode Latihan.
  if (theme === "p5") { window.p5LastOptionEl = btnEl || null; window.p5LastLetter = letter; }
  if (quizMode === "biasa") {
    handleAnswerBiasa(qid, letter);
  } else if (quizMode === "tentamen" && tentamenState === "running" && qPhase === "answering") {
    handleAnswerTentamen(letter);
  }
}

// ── Submit jawaban isian (delegasi, dipakai Latihan & Tentamen) ──────────
function onIsianSubmit(qid, text) {
  if (quizMode === "biasa") {
    handleAnswerIsian(qid, text);
  } else if (quizMode === "tentamen" && tentamenState === "running" && qPhase === "answering") {
    handleAnswerTentamenIsian(text);
  }
}

// ── beforeunload — hanya warning saat tentamen sedang berjalan ───────────
window.addEventListener("beforeunload", (e) => {
  if (quizMode === "tentamen" && tentamenState === "running") {
    e.preventDefault();
    e.returnValue = "";
  }
});

// ── State: soal rusak yang sudah di-tap (revealed) ────────────────────────
const brokenRevealed = new Set(); // Set of q.id that have been tapped open

// ── Render: kartu soal rusak (tap-to-reveal) ──────────────────────────────
function renderBrokenCard(q, qNum) {
  const isRevealed = brokenRevealed.has(q.id);
  const hasImages = (q.explanationImages || []).length > 0;
  const hasQImages = (q.questionImages || []).length > 0;
  const exText = (q.explanationText || []).filter(Boolean);

  const revealHtml = isRevealed ? `
    <div class="brokenReveal">
      <div class="tag">🖼️ Gambar Penjelasan</div>
      ${hasQImages ? renderImgs(q.questionImages || [], "exImg", "gambar soal") : ""}
      ${exText.length ? `<div class="exText">${exText.map(t => `<p>${escapeHtml(t)}</p>`).join("")}</div>` : ""}
      ${hasImages
        ? renderImgs(q.explanationImages || [], "exImg", "gambar penjelasan")
        : exText.length ? "" : `<p class="noImg">(belum ada gambar penjelasan di dokumen ini)</p>`}
    </div>
  ` : "";

  return `
    <div class="brokenCard" data-broken-id="${escapeAttr(q.id)}">
      <div class="brokenMeta">
        <span class="brokenBadge">⚠️ Soal Rusak</span>
        ${!isRevealed ? `<span class="tapHint">👆 Tap untuk lihat gambar</span>` : `<span class="tapHint">👆 Tap lagi untuk tutup</span>`}
      </div>
      <p class="brokenQ"><span class="brokenNum">${qNum}.</span>${escapeHtml(q.question)}</p>
      ${revealHtml}
    </div>
  `;
}

// ── Render: kartu soal isian (textarea → submit → reveal kunci) ──────────
// Dipakai di Mode Latihan & Mode Tentamen. answeredValue:
//   undefined/null/""  → belum dijawab, tampilkan input
//   "skipped"          → dilewati (waktu habis di Tentamen; tidak pernah terjadi di Latihan)
//   string lain        → jawaban yang dikirim user (self-graded, selalu dianggap benar)
function renderIsianCard(q, qNum, answeredValue) {
  const isSkipped = answeredValue === "skipped";
  const isAnswered = !isSkipped && answeredValue !== undefined && answeredValue !== null && answeredValue !== "";

  let bodyHtml;
  if (isSkipped) {
    bodyHtml = `
      <div class="isianReveal">
        <div class="skipNote">⏭️ Soal ini dilewati (waktu habis)</div>
        <div class="explanation">
          <div class="tag">🔑 Kunci Jawaban</div>
          <p>${escapeHtml(q.answer || "(tidak ada kunci jawaban)")}</p>
        </div>
      </div>
    `;
  } else if (isAnswered) {
    bodyHtml = `
      <div class="isianReveal">
        <div class="isianYourAnswer">
          <div class="tag">✍️ Jawaban kamu <span class="icon ok">✓</span> <span class="isianCorrectLabel">Benar</span></div>
          <p>${escapeHtml(answeredValue)}</p>
        </div>
        <div class="explanation">
          <div class="tag">🔑 Kunci Jawaban</div>
          <p>${escapeHtml(q.answer || "(tidak ada kunci jawaban)")}</p>
        </div>
      </div>
    `;
  } else {
    bodyHtml = `
      <div class="isianInputRow">
        <textarea class="isianInput" data-qid="${escapeAttr(q.id)}" rows="2" placeholder="Ketik jawabanmu di sini…"></textarea>
        <button class="isianSubmitBtn" data-qid="${escapeAttr(q.id)}" title="Kirim jawaban" aria-label="Kirim jawaban">▶</button>
      </div>
    `;
  }

  return `
    <div class="qCard isianCard">
      <div class="qMeta">
        <span class="isianBadge">✍️ Isian</span>
        ${(q.questionImages || []).length > 0 ? `<span class="imgBadge">🖼️ Bergambar</span>` : ""}
        ${isAnswered ? `<span class="tapHint">✅ Sudah dijawab</span>` : ""}
      </div>
      <p class="qText"><span class="qNum mono">${qNum}.</span>${escapeHtml(q.question)}</p>
      ${renderImgs(q.questionImages || [], "qImg", "gambar soal")}
      ${bodyHtml}
    </div>
  `;
}

// ── Render: kartu soal (dipakai di semua mode) ────────────────────────────
// Gambar opsi (thumbnail berukuran wajar) + tombol 🔍. Tombol ini <span>, bukan <button>,
// karena letaknya di dalam <button class="option">. Klik-nya ditangkap js/img-zoom.js.
function optionImageHtml(src) {
  return `<span class="optImgWrap"><img class="optImg" src="${escapeAttr(src)}" alt="gambar opsi" loading="lazy"><span class="optZoom" data-zoom-src="${escapeAttr(src)}" title="Perbesar" aria-label="Perbesar gambar"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.6 15.6 20.5 20.5" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg></span></span>`;
}

function renderQuestionCard(q, qNum, chosen, revealAnswer) {
  const isAnswered = chosen !== undefined && chosen !== null;
  const showState = revealAnswer && isAnswered;
  const oExp = q.optionExplanations || {};

  const optionsHtml = Object.entries(q.options).map(([letter, text]) => {
    let cls = "option";
    let letterCls = "letter";
    let icon = "";
    const locked = isAnswered ? " locked" : "";
    const imgSrc = (q.optionImages || {})[letter];
    if (imgSrc) cls += " hasImg";

    if (!showState) {
      if (chosen === letter) cls += " selected";
    } else {
      if (letter === q.answer) {
        cls += " correct"; letterCls += " correct";
        if (chosen === letter) icon = `<span class="icon ok">\u2713</span>`;
      } else if (letter === chosen) {
        cls += " wrong"; letterCls += " wrong";
        icon = theme === "p5"
          ? `<span class="icon no"><img src="./images/inline/6d225a17272f.png" alt="salah" style="width:14px;height:14px;vertical-align:middle;"></span>`
          : `<span class="icon no">\u2715</span>`;
      } else {
        cls += " faded"; letterCls += " faded";
      }
    }

    // Penjelasan per opsi: hanya tampil setelah jawab, dan hanya kalau memang ada.
    let expTag = "";
    if (letter === q.answer) expTag = `<span class="optExpTag ok">\u2713 Jawaban yang benar</span>`;
    else if (letter === chosen) expTag = `<span class="optExpTag no">\u2715 Kurang tepat</span>`;
    const expHtml = (showState && oExp[letter]) ? `<span class="optExp">${expTag}${escapeHtml(oExp[letter])}</span>` : "";

    return `
      <button class="${cls}${locked}" data-qid="${escapeAttr(q.id)}" data-letter="${escapeAttr(letter)}">
        <span class="${letterCls}" data-letter="${letter}">${(document.body.classList.contains("doksli") && window._dkImg) ? `<img class="doksli-letter-img" src="${window._dkImg()}" aria-hidden="true">` : letter}</span>
        <span class="optBody">
          ${imgSrc ? optionImageHtml(imgSrc) : ""}
          ${text ? `<span class="optText">${escapeHtml(text)}</span>` : ""}
          ${expHtml}
        </span>
        ${icon}
      </button>
    `;
  }).join("");

  const skipNoteHtml = (showState && chosen === "skipped")
    ? `<div class="skipNote">\u23ED\uFE0F Soal ini dilewati (waktu habis)</div>`
    : "";

  // Card Gambar Penjelasan: teks opsional, utamanya gambar. Tidak tampil kalau kosong.
  const hasGambarPenj = !!q.explanation || (q.explanationImages || []).length > 0;
  const explanationHtml = (showState && hasGambarPenj) ? `
    <div class="explanation">
      <div class="tag">\uD83D\uDDBC\uFE0F Gambar Penjelasan</div>
      ${q.explanation ? `<p>${escapeHtml(q.explanation)}</p>` : ""}
      ${renderImgs(q.explanationImages || [], "exImg", "gambar penjelasan")}
    </div>
  ` : "";

  return `
    <div class="qCard">
      <div class="qMeta">
        ${(q.questionImages || []).length > 0 ? `<span class="imgBadge">\uD83D\uDDBC\uFE0F Bergambar</span>` : ""}
      </div>
      <p class="qText"><span class="qNum mono">${qNum}.</span>${escapeHtml(q.question)}</p>
      ${renderImgs(q.questionImages || [], "qImg", "gambar soal")}
      <div class="options">${optionsHtml}</div>
      ${skipNoteHtml}
      ${explanationHtml}
    </div>
  `;
}

// ── Render: header + mode bar + filter bar ────────────────────────────────
function renderHeaderZone() {
  const quizzableAll = allQuestions.filter(q => !q.isBroken && !q.isIsian);
  const totalQ = quizzableAll.length; // soal rusak & soal isian tidak dihitung di tracker
  let trackerHtml = "";
  if (quizMode === "biasa" && biasaLoaded) {
    const answeredCount = quizzableAll.filter(q => biasaAnswersMap[q.id] !== undefined && biasaAnswersMap[q.id] !== null).length;
    const correctCount = quizzableAll.filter(q => biasaAnswersMap[q.id] === q.answer).length;
    trackerHtml = `
      <div class="tracker">
        <div class="count mono">${answeredCount}/${totalQ}</div>
        <div class="sub">dijawab \u00B7 benar <span class="ok">${correctCount}</span></div>
      </div>
    `;
  } else if (quizMode === "tentamen" && tentamenState === "running") {
    trackerHtml = `
      <div class="tracker">
        <div class="count mono">${currentIdx + 1}/${tentamenQuestions.length}</div>
        <div class="sub">soal</div>
      </div>
    `;
  }

  const showFilterBar = quizMode === "biasa" || (quizMode === "tentamen" && tentamenState === "setup");
  const activeShuffle = quizMode === "biasa" ? biasaShuffleOn : tentamenShuffleOn;
  const showReset = (quizMode === "biasa" && biasaLoaded) || (quizMode === "tentamen" && tentamenState !== "setup");

  return `
    <div class="headerZone">
      ${headerHidden ? "" : `
      <div class="headerCollapse">
        <header>
          <div class="headerInner">
            <div class="titleRow">
              <div>
                <h1${activePackage ? ` class="pkgTitleActive"` : ""}>${activePackage ? escapeHtml(activePackage.title) : "Quiz App"}</h1>
                ${activePackage ? `<div class="pkgSubtitle">${escapeHtml(activePackage.category)}</div>` : ""}
                <button class="pkgSwitchBtn" id="pkgSwitchBtn">\uD83D\uDCC2 ${activePackage ? "Ganti paket" : "Pilih paket soal"}</button>
              </div>
              ${trackerHtml}
            </div>
          </div>
        </header>
      </div>

      <div class="modeBar">
        <div class="modeBarInner">
          <button class="hideToggleBtn${headerHidden ? " active" : ""}" id="hideHeaderBtn" title="Sembunyikan header" aria-label="Sembunyikan header">
            <span class="arrow">\u25B2</span>
          </button>
          <button class="muteBtn${isMuted ? "" : " on"}" id="muteBtn" title="${isMuted ? "Nyalakan suara" : "Matikan suara"}">${isMuted ? "\uD83D\uDD07" : "\uD83D\uDD0A"}</button>
          <button class="pillBtn${quizMode === "biasa" ? " active" : ""}" data-mode="biasa">Mode Latihan</button>
          <button class="pillBtn${quizMode === "tentamen" ? " active" : ""}" data-mode="tentamen">Mode Tentamen</button>
          ${showFilterBar ? `<button class="shuffleBtn${activeShuffle ? " active" : ""}" id="shuffleBtn">\u2928 Acak ${activeShuffle ? "ON" : "OFF"}</button>` : ""}
          ${showReset ? `<button class="resetBtn" id="resetBtn">\u21BA Reset</button>` : ""}
        </div>
      </div>`}

      ${headerHidden ? `
      <div class="collapsedToggleWrap">
        <button class="hideToggleBtn" id="hideHeaderBtn" title="Tampilkan header" aria-label="Tampilkan header">
          <span class="arrow" style="transform:rotate(180deg);">\u25B2</span>
        </button>
      </div>` : ""}
    </div>
  `;
}

// ── Render: Mode Latihan ──────────────────────────────────────────────────
function renderBiasaMode() {
  const allQ = computeBiasaAll();
  const visible = allQ.slice(0, biasaVisibleCount);
  // Soal rusak & soal isian tidak dihitung di progress tracker (bukan pilihan ganda)
  const quizzableQ = allQ.filter(q => !q.isBroken && !q.isIsian);
  const answeredCount = quizzableQ.filter(q => biasaAnswersMap[q.id] !== undefined && biasaAnswersMap[q.id] !== null).length;
  const correctCount = quizzableQ.filter(q => biasaAnswersMap[q.id] === q.answer).length;
  const totalCount = quizzableQ.length; // hanya soal yang bisa dijawab
  const pct = totalCount > 0 ? Math.round((answeredCount / totalCount) * 100) : 0;
  const allDone = answeredCount === totalCount && totalCount > 0;
  const hasMore = biasaVisibleCount < allQ.length; // load more berdasarkan total semua soal
  const remaining = allQ.length - visible.length;

  let html = `
    <div class="progressCard">
      <div class="progressTop">
        <span class="left">Sudah dijawab: <span class="num mono">${answeredCount}</span> / Total: <span class="num total mono">${totalCount}</span></span>
        <div style="display:flex; gap:12px;">
          <span class="statChip"><span class="dot" style="background:var(--correct);"></span><span class="mono" style="color:var(--correct); font-weight:700;">${correctCount}</span><span style="color:var(--muted2);">benar</span></span>
          <span class="statChip"><span class="dot" style="background:var(--wrong);"></span><span class="mono" style="color:var(--wrong); font-weight:700;">${answeredCount - correctCount}</span><span style="color:var(--muted2);">salah</span></span>
        </div>
      </div>
      <div class="progressTrack"><div class="progressFill" style="width:${pct}%;"></div></div>
    </div>
  `;

  if (allDone) {
    html += `
      <div class="doneBanner">
        <span style="font-size:1.3rem;">\uD83C\uDFC6</span>
        <div>
          <span class="title">Selesai! </span>
          <span class="sub">Skor akhir: ${correctCount}/${totalCount} (${Math.round((correctCount/totalCount)*100)}%)</span>
        </div>
      </div>
    `;
  }

  if (allQ.length === 0) {
    html += `<div class="empty">Tidak ada soal pada kategori ini.</div>`;
    return html;
  }

  html += `<div class="qList">`;
  visible.forEach((q, idx) => {
    if (q.isBroken) {
      html += renderBrokenCard(q, idx + 1);
    } else if (q.isIsian) {
      html += renderIsianCard(q, idx + 1, biasaAnswersMap[q.id]);
    } else {
      html += renderQuestionCard(q, idx + 1, biasaAnswersMap[q.id], true);
    }
  });
  html += `</div>`;

  if (hasMore) {
    html += `<button class="loadMoreBtn" id="loadMoreBtn">\u2794 Lebih banyak (${Math.min(LOAD_BATCH, remaining)})</button>`;
  }

  return html;
}

// ── Render: Tentamen — setup ──────────────────────────────────────────────
function renderTentamenSetup() {
  const qCount = allQuestions.filter(q => !q.isBroken).length; // soal rusak tidak masuk tentamen; soal isian ikut
  const cfg = DIFFICULTY_CONFIG[tentamenDifficulty];
  const timerSec = cfg.timerSeconds;
  const estLabel = (() => {
    if (timerSec === 0) return "\u221E";
    const totalSec = qCount * timerSec;
    if (totalSec < 60) return `${totalSec} dtk`;
    return `${Math.ceil(totalSec / 60)} menit`;
  })();
  const timerLabel = timerSec === 0 ? "\u221E" : `${timerSec}s`;

  let html = `<div class="quiz-fade-in">`;
  html += `<div style="margin-bottom:16px;">
    <div class="sectionLabel">Tingkat Kesulitan</div>
    <div class="diffGrid">`;
  Object.keys(DIFFICULTY_CONFIG).forEach(d => {
    const dcfg = DIFFICULTY_CONFIG[d];
    const active = tentamenDifficulty === d;
    html += `
      <button class="diffCard${active ? " active" : ""}" data-diff="${d}" style="${active ? `border-color:${dcfg.color}; background:${dcfg.color}18;` : ""}">
        <div class="diffTop">
          <span class="diffEmoji">${diffIconHtml(dcfg, "diffIcon")}</span>
          <span class="diffLabel" style="color:${active ? dcfg.color : "var(--text)"};">${dcfg.label}</span>
        </div>
        <div class="diffDesc">${escapeHtml(dcfg.desc)}</div>
        <div class="diffTimer" style="color:${active ? dcfg.color : "var(--muted3)"};">${dcfg.timerSeconds === 0 ? "5-7 hari kerja" : `${dcfg.timerSeconds}s / soal`}</div>
      </button>
    `;
  });
  html += `</div></div>`;

  html += `<div class="statsRow3">
    <div class="statBox2"><div class="val">${qCount}</div><div class="lbl">Soal</div></div>
    <div class="statBox2"><div class="val">${timerLabel}</div><div class="lbl">Timer/soal</div></div>
    <div class="statBox2"><div class="val">${estLabel}</div><div class="lbl">Estimasi</div></div>
  </div>`;

  html += `<button class="startTentamenBtn" id="startTentamenBtn" style="background:${cfg.color};" ${qCount === 0 ? "disabled" : ""}>
    \u25B6 Mulai Tentamen \u2014 ${diffIconHtml(cfg, "startIcon")} ${cfg.label}
  </button>`;
  html += `</div>`;
  return html;
}

// ── Render: Tentamen — running ────────────────────────────────────────────
function renderTentamenRunning() {
  const q = tentamenQuestions[currentIdx];
  if (!q) return `<div class="empty">Tidak ada soal.</div>`;
  const cfg = DIFFICULTY_CONFIG[tentamenDifficulty];
  const maxTime = cfg.timerSeconds || 1;
  const isAnswering = qPhase === "answering";
  const isManual = qPhase === "answered_manual";
  const isTimeout = qPhase === "answered_timeout";
  const isUrgent = timeLeft <= 10 && isAnswering && tentamenDifficulty !== "bekicot";
  const timerPct = tentamenDifficulty === "bekicot" ? 100 : (timeLeft / maxTime) * 100;
  const total = tentamenQuestions.length;
  const qNum = currentIdx + 1;

  // Fade-in cuma pas soal ini pertama kali tampil (baru pindah/mulai) —
  // BUKAN tiap render() ulang gara-gara jawaban diklik (lihat komentar di
  // deklarasi tentamenFadeKey).
  const freshKey = tentamenState + "|" + currentIdx;
  const isFreshQuestion = freshKey !== tentamenFadeKey;
  tentamenFadeKey = freshKey;
  let html = `<div class="${isFreshQuestion ? "quiz-fade-in" : ""}">`;

  html += `<div class="tentamenTop">
    <span class="qOf">Soal <span class="mono" style="color:var(--accent); font-weight:700;">${qNum}</span> dari ${total}</span>
    <div class="dotsRow">`;
  const dotCount = Math.min(total, 15);
  for (let i = 0; i < dotCount; i++) {
    const done = i < qNum - 1;
    const current = i === qNum - 1;
    html += `<div class="dotItem${done ? " done" : ""}${current ? " current" : ""}"></div>`;
  }
  if (total > 15) html += `<span class="dotsOverflow">+${total - 15}</span>`;
  html += `</div></div>`;

  html += `<div class="timerCard${isUrgent ? " urgent" : ""}${isTimeout ? " timeoutFlash" : ""}" id="timerCard">
    <div class="timerTop">
      <div class="timerLabel${isUrgent ? " urgent" : ""}" id="timerLabel">
        \u23F1 ${tentamenDifficulty === "bekicot" ? "No timer \uD83D\uDC0C" : isAnswering ? "Waktu tersisa" : isTimeout ? "Waktu habis!" : "Selesai"}
      </div>
      <span class="timerNum${isUrgent ? " pulse" : ""}" id="timerNum" style="color:${isUrgent ? "var(--wrong-strong)" : cfg.color};">
        ${tentamenDifficulty === "bekicot" ? "\u221E" : String(isAnswering ? timeLeft : isTimeout ? 0 : timeLeft).padStart(2, "0")}
      </span>
    </div>
    <div class="timerTrack"><div class="timerFill" id="timerFill" style="background:${isUrgent ? "var(--wrong-strong)" : cfg.color}; width:${tentamenDifficulty === "bekicot" ? 100 : isAnswering ? timerPct : isTimeout ? 0 : 100}%;"></div></div>
  </div>`;

  html += q.isIsian
    ? renderIsianCard(q, qNum, tentamenAnswers[currentIdx])
    : renderQuestionCard(q, qNum, tentamenAnswers[currentIdx], qPhase !== "answering");

  if (isTimeout) {
    html += `<div class="timeoutNotice">\u26A0\uFE0F <span>Waktu habis! Soal ini dihitung terlewati. Melanjutkan\u2026</span></div>`;
  }

  if (isManual) {
    html += `<button class="nextBtn" id="nextTentamenBtn">${qNum < total ? "\u2794 Soal Berikutnya" : "\uD83C\uDFC6 Lihat Hasil"}</button>`;
  }

  html += `</div>`;
  return html;
}

// ── Render: Tentamen — hasil ──────────────────────────────────────────────
function renderTentamenResults() {
  const total = tentamenQuestions.length;
  const correct = tentamenAnswers.filter((a, i) => {
    if (typeof a !== "string" || a === "skipped") return false;
    const q = tentamenQuestions[i];
    // Soal isian self-graded: jawaban apa pun yang terisi dihitung benar (sama seperti Mode Latihan).
    return q?.isIsian ? true : a === q?.answer;
  }).length;
  const skipped = tentamenAnswers.filter(a => a === "skipped").length;
  const wrong = total - correct - skipped;
  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  const gradeColor = pct >= 80 ? "var(--correct)" : pct >= 60 ? "var(--accent)" : "var(--wrong)";
  const gradeLabel = pct >= 80 ? "Sangat Baik" : pct >= 60 ? "Cukup Baik" : "Perlu Belajar Lagi";

  let html = `<div class="quiz-fade-in">`;

  html += `
    <div class="scoreHero">
      <div class="trophy">\uD83C\uDFC6</div>
      <div class="pct" style="color:${gradeColor};">${pct}%</div>
      <div class="gradeLabel" style="color:${gradeColor};">${gradeLabel}</div>
      <div class="subline">${correct} dari ${total} soal benar</div>
    </div>
  `;

  html += `
    <div class="statsGrid statsGrid3">
      <div class="statBox" style="background:#16a34a20; border-color:#16a34a40; color:var(--correct);"><div class="val mono">${correct}</div><div class="lbl">Benar</div></div>
      <div class="statBox" style="background:#ef444420; border-color:#ef444440; color:var(--wrong);"><div class="val mono">${wrong}</div><div class="lbl">Salah</div></div>
      <div class="statBox" style="background:#94a3b818; border-color:#94a3b835; color:#94a3b8;"><div class="val mono">${skipped}</div><div class="lbl">Terlewati</div></div>
    </div>
  `;

  html += `
    <div class="progressCard">
      <div style="font-size:0.75rem; color:var(--muted2); margin-bottom:8px;">Distribusi jawaban</div>
      <div class="distBar">
        ${correct > 0 ? `<div style="flex:${correct}; background:var(--correct);"></div>` : ""}
        ${wrong > 0 ? `<div style="flex:${wrong}; background:var(--wrong);"></div>` : ""}
        ${skipped > 0 ? `<div style="flex:${skipped}; background:#475569;"></div>` : ""}
      </div>
      <div class="distLegend">
        <span style="color:var(--correct);">${pct}% benar</span>
        <span style="color:var(--wrong);">${total ? Math.round((wrong/total)*100) : 0}% salah</span>
        <span style="color:#94a3b8;">${total ? Math.round((skipped/total)*100) : 0}% terlewati</span>
      </div>
    </div>
  `;

  html += `<button class="restartBtn" id="restartTentamenBtn">\u21BA Ulangi Tentamen</button>`;

  html += `<div class="reviewLabel">Detail jawaban:</div>`;
  html += `<div class="reviewList">`;
  tentamenQuestions.forEach((q, idx) => {
    html += q.isIsian
      ? renderIsianCard(q, idx + 1, tentamenAnswers[idx])
      : renderQuestionCard(q, idx + 1, tentamenAnswers[idx], true);
  });
  html += `</div>`;

  html += `</div>`;
  return html;
}

function render() {
  syncThemeClass();

  if (mpScreen) {
    app.innerHTML = renderMultiplayerScreen();
    attachMultiplayerHandlers();
    return;
  }

  if (pickerOpen || !allQuestions || allQuestions.length === 0) {
    app.innerHTML = renderPickerScreen();
    attachPickerHandlers();
    if (theme === "p5") requestAnimationFrame(p5ApplyRansom);
    return;
  }

  let html = renderHeaderZone();
  html += `<main class="wrap">`;

  if (quizMode === "biasa") {
    html += biasaLoaded ? renderBiasaMode() : `<div class="empty">Memuat soal\u2026</div>`;
  } else {
    if (tentamenState === "setup") html += renderTentamenSetup();
    else if (tentamenState === "running") html += renderTentamenRunning();
    else html += renderTentamenResults();
  }

  html += `</main>`;
  // Simpen posisi scroll sebelum innerHTML diganti — app.innerHTML = html
  // ngganti seluruh subtree, dan browser bisa "lompat" balik ke atas
  // sesaat. Ini salah satu sumber "blink" paling kerasa di Mode Latihan
  // (daftar soal panjang, tiba-tiba serasa nge-jump tiap jawab).
  const prevScrollY = window.scrollY;
  app.innerHTML = html;
  window.scrollTo(0, prevScrollY);
  attachHandlers();
  if (theme === "p5") requestAnimationFrame(p5ApplyRansom);
}

  // Called after render() whenever in doksli mode
  // Attaches meme stickers to revealed correct/wrong options
  function doksliAttachStickers() {
    if (!document.body.classList.contains("doksli")) return;

    // Remove existing stickers first
    document.querySelectorAll(".doksli-sticker").forEach(el => el.remove());

    // querySelectorAll, not querySelector: list-style modes can have several
    // revealed questions on screen at once, so there can be more than one
    // .option.correct/.wrong in the document at a time.
    const correctOpts = document.querySelectorAll(".option.correct");
    const wrongOpts   = document.querySelectorAll(".option.wrong");

    const attach = (opt, corner) => {
      const sticker = document.createElement("img");
      sticker.className = "doksli-sticker";
      sticker.src = window._dkImg();
      sticker.setAttribute("aria-hidden", "true");
      sticker.dataset.corner = corner;
      opt.appendChild(sticker);
    };
    // Adding these <img> elements is itself a mutation inside #app, which the
    // MutationObserver below watches — without disconnecting first, that
    // observer re-fires on our own insert and keeps re-attaching forever,
    // cycling window._dkImg() every cycle (the rapid "changing" look).
    if (typeof _doksliMutObs !== "undefined") _doksliMutObs.disconnect();
    correctOpts.forEach(opt => attach(opt, "tr"));
    wrongOpts.forEach(opt => attach(opt, "br"));
    const _dkApp = document.getElementById("app");
    if (typeof _doksliMutObs !== "undefined" && _dkApp) {
      _doksliMutObs.observe(_dkApp, { childList: true, subtree: true });
    }

    // Scroll fade: when sticker scrolls to within 56px of top of viewport, fade it
    doksliUpdateStickerOpacity();
  }

  function doksliUpdateStickerOpacity() {
    document.querySelectorAll(".doksli-sticker").forEach(sticker => {
      const rect = sticker.closest(".option")?.getBoundingClientRect();
      if (!rect) return;
      const headerH = document.querySelector(".headerZone")?.offsetHeight || 56;
      const clearance = rect.top - headerH;
      // Full opacity when option is 80px+ below header, fade to 0.08 when overlapping
      const opacity = clearance < 80
        ? Math.max(0.08, clearance / 80)
        : 1;
      sticker.style.opacity = String(opacity);
    });
  }

  // Scroll listener for fade
  window.addEventListener("scroll", doksliUpdateStickerOpacity, { passive: true });
  document.addEventListener("scroll", doksliUpdateStickerOpacity, { passive: true, capture: true });

  // Hook into render — call doksliAttachStickers after every render when answered
  const _origRender = typeof render === "function" ? render : null;
  // We patch via MutationObserver on .options instead (safer)
  const _doksliMutObs = new MutationObserver(() => {
    if (document.body.classList.contains("doksli")) {
      // Debounce
      clearTimeout(_doksliMutObs._t);
      _doksliMutObs._t = setTimeout(doksliAttachStickers, 60);
    }
  });
  document.addEventListener("DOMContentLoaded", () => {
    const optionsContainer = document.getElementById("app");
    if (optionsContainer) {
      _doksliMutObs.observe(optionsContainer, { childList: true, subtree: true });
    }
    // Also fire once on theme change
    document.body.addEventListener("classchange", doksliAttachStickers);
  });
  new MutationObserver(() => {
    if (document.body.classList.contains("doksli")) {
      clearTimeout(window._doksliThemeT);
      window._doksliThemeT = setTimeout(doksliAttachStickers, 80);
    } else {
      document.querySelectorAll(".doksli-sticker").forEach(el => el.remove());
    }
  }).observe(document.body, { attributes: true, attributeFilter: ["class"] });

const _unhex = s => Uint8Array.from(s.match(/../g), x => parseInt(x, 16));
async function pbkdf2Hex(pw, saltHex, iter) {
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return _hex(await crypto.subtle.deriveBits(
    { name: "PBKDF2", hash: "SHA-256", salt: _unhex(saltHex), iterations: iter }, key, 256));
}
function safeEq(a, b) {            // constant-time compare
  if (a.length !== b.length) return false;
  let d = 0;
  for (let i = 0; i < a.length; i++) d |= a.charCodeAt(i) ^ b.charCodeAt(i);
  return d === 0;
}
async function gateMake(pw) {      // helper buat bikin hash baru (dipakai manual dari console)
  const s = _hex(crypto.getRandomValues(new Uint8Array(16)));
  console.log(`const GATE_SALT = "${s}";\nconst GATE_HASH = "${await pbkdf2Hex(pw, s, GATE_ITER)}";`);
}

async function gateSubmit() {
  const inp = document.getElementById("gate-input");
  const err = document.getElementById("gate-err");
  const btn = document.getElementById("gate-btn");
  if (!window.crypto || !crypto.subtle) {
    err.textContent = "Butuh HTTPS atau localhost (Web Crypto tidak tersedia).";
    return;
  }
  btn.disabled = true;
  let ok = false;
  try { ok = safeEq(await pbkdf2Hex(inp.value, GATE_SALT, GATE_ITER), GATE_HASH); } catch { /* noop */ }
  btn.disabled = false;
  if (ok) {
    try { localStorage.setItem(GATE_KEY, "1"); } catch { /* noop */ }
    document.getElementById("gate-overlay").classList.add("hidden");
    inp.classList.remove("error");
    inp.value = "";
    err.textContent = "";
  } else {
    inp.classList.add("error");
    err.textContent = "Password salah. Coba lagi.";
    setTimeout(() => inp.classList.remove("error"), 400);
  }
}

function gateInit() {
  let unlocked = false;
  try { unlocked = localStorage.getItem(GATE_KEY) === "1"; } catch { /* noop */ }
  if (unlocked) {
    document.getElementById("gate-overlay").classList.add("hidden");
  } else {
    // Enter key support
    document.getElementById("gate-input").addEventListener("keydown", e => {
      if (e.key === "Enter") gateSubmit();
    });
    // Focus the input
    setTimeout(() => document.getElementById("gate-input").focus(), 100);
  }
}

gateInit();
